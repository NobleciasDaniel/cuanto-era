<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cuánto Era</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <header class="app-header">
      <div class="brand-lockup">
        <img class="brand-mark" src="../../icons/icon32.png" alt="">
        <div>
          <h1>Cuánto Era</h1>
          <p>Recuerda cuánto costaba</p>
        </div>
      </div>
      <button id="open-dashboard" class="history-button" type="button">
        Historial <span aria-hidden="true">→</span>
      </button>
    </header>

    <main>
      <section id="status" class="status" aria-live="polite">
        <span class="spinner" aria-hidden="true"></span>
        <div>
          <strong>Buscando el precio</strong>
          <p>Esto suele tardar menos de un segundo.</p>
        </div>
      </section>

      <section id="product" class="product" hidden>
        <div class="product-overview">
          <img id="product-image" class="product-image" alt="" hidden>
          <div class="product-copy">
            <span id="store" class="store"></span>
            <h2 id="product-title">Cargando producto</h2>
            <p id="variant" class="variant" hidden></p>
          </div>
        </div>

        <div class="price-block">
          <span>Precio de esta visita</span>
          <strong id="current-price"></strong>
          <del id="original-price" hidden></del>
        </div>

        <p id="details" class="details"></p>

        <div id="comparison" class="comparison" hidden>
          <div>
            <span>Registro anterior</span>
            <strong id="previous-price"></strong>
            <small id="previous-date"></small>
          </div>
          <div id="change-card" class="change-card">
            <strong id="change-value"></strong>
            <span id="change-label"></span>
          </div>
        </div>

        <div id="history-stats" class="history-stats" hidden>
          <div><span>Mínimo</span><strong id="minimum-price"></strong></div>
          <div><span>Máximo</span><strong id="maximum-price"></strong></div>
          <div><span>Capturas</span><strong id="history-count"></strong></div>
        </div>

        <button id="save" class="primary-button" type="button">Guardar este precio</button>
        <p id="save-feedback" class="save-feedback" aria-live="polite"></p>
      </section>

      <p class="privacy-note">
        Solo se procesa esta pestaña cuando abres la extensión. Nada se envía fuera del navegador.
        <a href="../privacy/privacy.html" target="_blank">Privacidad</a>
      </p>
    </main>

    <script type="module" src="popup.js"></script>
  </body>
</html>
