<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vista previa de captura</title>
    <style>
      * { box-sizing: border-box; }
      body { min-width: 1280px; min-height: 800px; margin: 0; overflow: hidden; color: #1e241f; background: #f4f2ed; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .shop-header { display: flex; min-height: 64px; align-items: center; justify-content: space-between; padding: 0 58px; border-bottom: 1px solid #deddd7; background: #fff; }
      .shop-header strong { font-size: 16px; }
      .shop-header nav { display: flex; gap: 24px; color: #6c716c; font-size: 12px; }
      .product-page { display: grid; grid-template-columns: 1fr 1fr; gap: 70px; width: 1060px; margin: 72px auto; }
      .product-visual { display: grid; min-height: 510px; place-items: center; border: 1px solid #deddd7; background: #faf9f6; }
      .product-visual span { display: grid; width: 230px; height: 230px; place-items: center; border: 22px solid #176b52; border-radius: 50%; color: #176b52; font-size: 72px; font-weight: 750; }
      .shop-copy { padding-top: 36px; }
      .shop-copy small { color: #176b52; font-weight: 700; letter-spacing: .12em; }
      .shop-copy h1 { max-width: 420px; margin: 16px 0 20px; font-size: 38px; line-height: 1.12; letter-spacing: -.04em; }
      .shop-copy .price { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 29px; font-weight: 700; }
      .shop-copy p { max-width: 400px; color: #6c716c; font-size: 14px; line-height: 1.6; }
      iframe { position: fixed; top: 34px; right: 42px; width: 380px; height: 720px; border: 1px solid #c8cbc5; border-radius: 10px; background: #fbfaf6; box-shadow: 0 18px 70px rgb(23 32 26 / 22%); }
    </style>
  </head>
  <body>
    <header class="shop-header"><strong>Tienda Ejemplo</strong><nav><span>Novedades</span><span>Cocina</span><span>Soporte</span></nav></header>
    <main class="product-page">
      <div class="product-visual"><span>CE</span></div>
      <div class="shop-copy">
        <small>CAFÉ EN CASA</small>
        <h1>Cafetera automática compacta con molino ajustable</h1>
        <div class="price">MXN 2,199.00</div>
        <p>Una página de producto de ejemplo para mostrar cómo Cuánto Era reconoce y compara el precio visible.</p>
      </div>
    </main>
    <iframe src="popup-preview-inner.html" title="Popup de Cuánto Era"></iframe>
  </body>
</html>
